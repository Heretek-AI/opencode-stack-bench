name: Self-test task suite

# Checks the benchmark itself without calling any model: every reference solution must
# pass its hidden tests, and no untouched fixture may already pass them.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: bash bench/selftest.sh
